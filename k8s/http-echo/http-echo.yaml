apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardmarkt-echo-deployment
  labels:
    app: cardmarkt-echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardmarkt-echo
  template:
    metadata:
      labels:
        app: cardmarkt-echo
    spec:
      containers:
      - name: http-echo
        image: hamza94/cardmarkt_http-echo:v1.2.1
        imagePullPolicy: Always
        ports:
        - containerPort: 5678
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

        # Startup Probe (Protects slow-starting containers; delays liveness/readiness until success)
        startupProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 30 

        # Liveness Probe (Restarts container if it becomes unhealthy)
        livenessProbe:
          httpGet:
            path: /
            port: 5678
          periodSeconds: 10
          failureThreshold: 3

        # Readiness Probe (Removes pod from service endpoints if temporarily overwhelmed or unready)
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          periodSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: cardmarkt-echo-service
  labels:
    app: cardmarkt-echo
spec:
  type: NodePort
  selector:
    app: cardmarkt-echo
  ports:
    - port: 80
      targetPort: 5678
      nodePort: 30080