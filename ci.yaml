# CI for Product Catalog Service

# This workflow is triggered on push events to the main branch. It performs the following steps:
# 1. Builds the Go application for the product catalog service.
name: Streamline CardMarkt CI/CD

# Trigger the workflow on push to main branch
on: 
    push:
      branches:
        - main

# Define the jobs to be run in the workflow
jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Step 1: Build and load locally so Trivy can see it
      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cardmarkt_http-echo:${{ github.run_id }}

      # Step 2: Scan that exact local image
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/cardmarkt_http-echo:${{ github.run_id }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Step 3: Push it to Docker Hub only if the scan passes
      - name: Docker Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cardmarkt_http-echo:${{ github.run_id }}
    
    updatek3s:
        runs-on: ubuntu-latest

        needs: docker_build_image

        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update tag in kubernetes deployment manifest
          run: | 
               sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/cardmarkt_http-echo:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
        
        - name: Commit and push changes
          run: |
            git config --global user.email "hamza.shabbir.94.4@gmail.com"
            git config --global user.name "Hamza Shabbir"
            git add kubernetes/productcatalog/deploy.yaml
            git commit -m "[CI]: Update http-echo image tag"
            git push origin HEAD:main -f

        
        
          


        